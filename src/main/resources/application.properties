spring.application.name=globalexceptionhandler

spring.datasource.url=jdbc:mariadb://localhost:3306/geh_db
spring.datasource.username=geh_user
spring.datasource.password=geh_pass

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.mvc.throw-exception-if-no-handler-found=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false
server.error.whitelabel.enabled=false

logging.level.root=INFO
logging.level.com.example.geh=DEBUG
