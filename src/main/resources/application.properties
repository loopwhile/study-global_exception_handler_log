############################################################
# application.properties (\uC124\uBA85 \uC8FC\uC11D \uD3EC\uD568 \u2014 \uCD08\uC2EC\uC790 \uCE5C\uD654\uC801)
# - \uB85C\uCEEC \uAC1C\uBC1C\uACFC \uD14C\uC2A4\uD2B8\uC5D0\uC11C \uC790\uC8FC \uC4F0\uC774\uB294 \uC124\uC815\uB4E4\uC744 \uC911\uC2EC\uC73C\uB85C \uC124\uBA85\uD569\uB2C8\uB2E4.
# - \uC6B4\uC601\uD658\uACBD\uC5D0\uC11C\uB294 \uBBFC\uAC10\uC815\uBCF4(\uC544\uC774\uB514/\uBE44\uBC00\uBC88\uD638)\uB294 \uD658\uACBD\uBCC0\uC218 \uB610\uB294 \uC2DC\uD06C\uB9BF \uB9E4\uB2C8\uC800\uB85C \uAD00\uB9AC\uD558\uC138\uC694.
############################################################

# \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC774\uB984 (Spring Boot Actuator/\uB85C\uADF8 \uB4F1\uC5D0\uC11C \uC0AC\uC6A9\uB420 \uC218 \uC788\uC74C)
# \uC608: 'application.name'\uC740 \uBAA8\uB2C8\uD130\uB9C1/\uB85C\uADF8\uC5D0\uC11C \uAC80\uC0C9\uD560 \uB54C \uC720\uC6A9\uD569\uB2C8\uB2E4.
spring.application.name=globalexceptionhandler

# -------------------------
# \uB370\uC774\uD130\uBCA0\uC774\uC2A4 (MariaDB) \uC124\uC815
# -------------------------
# JDBC URL: "jdbc:mariadb://<\uD638\uC2A4\uD2B8>:<\uD3EC\uD2B8>/<\uB370\uC774\uD130\uBCA0\uC774\uC2A4\uBA85>"
# - \uB85C\uCEEC\uC5D0\uC11C MySQL/MariaDB\uB97C \uB744\uC6B0\uACE0 \uD14C\uC2A4\uD2B8\uD560 \uB54C \uAE30\uBCF8 \uD615\uD0DC\uC785\uB2C8\uB2E4.
# - \uC6B4\uC601\uD658\uACBD\uC5D0\uC11C\uB294 \uD638\uC2A4\uD2B8/\uACC4\uC815/\uBE44\uBC00\uBC88\uD638\uB97C \uD658\uACBD\uBCC0\uC218\uB85C \uC8FC\uC785\uD558\uC138\uC694.
spring.datasource.url=jdbc:mariadb://localhost:3306/geh_db
spring.datasource.username=geh_user
spring.datasource.password=geh_pass

# JDBC \uB4DC\uB77C\uC774\uBC84 \uD074\uB798\uC2A4\uBA85 (MariaDB \uC0AC\uC6A9 \uC2DC)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# -------------------------
# JPA / Hibernate \uC124\uC815
# -------------------------
# ddl-auto \uC635\uC158:
# - none: \uBCC0\uACBD \uBD88\uAC00(\uAD8C\uC7A5 \uC6B4\uC601\uAC12)
# - validate: \uC5D4\uD2F0\uD2F0\uC640 DB \uC2A4\uD0A4\uB9C8\uB97C \uBE44\uAD50\uB9CC \uD568 (\uD14C\uC2A4\uD2B8/\uC6B4\uC601\uC5D0 \uC548\uC804)
# - update: \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC2E4\uD589 \uC2DC \uC5D4\uD2F0\uD2F0 \uAE30\uC900\uC73C\uB85C \uD14C\uC774\uBE14\uC744 \uBCC0\uACBD(\uAC1C\uBC1C\uC5D0 \uD3B8\uB9AC\uD558\uC9C0\uB9CC \uC6B4\uC601\uC5D0\uC11C \uC704\uD5D8\uD560 \uC218 \uC788\uC74C)
# - create / create-drop: \uC2E4\uD589\uD560 \uB54C\uB9C8\uB2E4 \uD14C\uC774\uBE14\uC744 \uC7AC\uC0DD\uC131 (\uD14C\uC2A4\uD2B8 \uC804\uC6A9)
spring.jpa.hibernate.ddl-auto=update

# open-in-view:
# - true: \uBDF0(Thymeleaf \uB80C\uB354\uB9C1 \uB4F1) \uC2DC\uC810\uC5D0\uB3C4 \uC5D4\uD2F0\uD2F0\uC758 LAZY \uB85C\uB529\uC744 \uD5C8\uC6A9
# - false: \uBDF0 \uB80C\uB354\uB9C1 \uC911 DB \uCFFC\uB9AC\uAC00 \uBC1C\uC0DD\uD558\uC9C0 \uC54A\uB3C4\uB85D(\uAD8C\uC7A5: false)
#   => \uC131\uB2A5/\uD2B8\uB79C\uC7AD\uC158 \uC548\uC815\uC131 \uB54C\uBB38\uC5D0 \uBCF4\uD1B5 false \uAD8C\uC7A5
spring.jpa.open-in-view=false

# SQL \uD3EC\uB9F7\uD305: \uCF58\uC194/\uB85C\uADF8\uC5D0 \uCD9C\uB825\uB418\uB294 SQL\uC744 \uBCF4\uAE30 \uC88B\uAC8C \uC815\uB82C
spring.jpa.properties.hibernate.format_sql=true

# SQL \uCD9C\uB825 \uC5EC\uBD80: \uAC1C\uBC1C \uC911\uB9CC true\uB85C \uCF1C\uC11C \uD655\uC778\uD558\uC138\uC694
spring.jpa.show-sql=false

# -------------------------
# \uC694\uCCAD \uCC98\uB9AC / \uC5D0\uB7EC \uCC98\uB9AC \uAD00\uB828 (\uC6F9)
# -------------------------
# 404 \uCC98\uB9AC \uBC29\uC2DD: \uD578\uB4E4\uB7EC\uAC00 \uC5C6\uC744 \uB54C \uC608\uC678\uB97C \uB358\uC9C0\uAC8C \uC124\uC815
# - true\uB85C \uD558\uBA74 NoHandlerFoundException\uC774 \uBC1C\uC0DD\uD574\uC11C \uC804\uC5ED \uC608\uC678 \uCC98\uB9AC\uAE30\uC5D0\uC11C \uC7A1\uC544 \uCC98\uB9AC \uAC00\uB2A5
# - (\uAE30\uBCF8 false)\uC774\uBA74 \uC2A4\uD504\uB9C1\uC774 \uAE30\uBCF8 \uC5D0\uB7EC \uD398\uC774\uC9C0\uB97C \uCC98\uB9AC\uD568
spring.mvc.throw-exception-if-no-handler-found=true

# \uC815\uC801 \uB9AC\uC18C\uC2A4 \uC790\uB3D9 \uB9E4\uD551 \uC124\uC815
# - spring.web.resources.add-mappings=false \uB85C \uD558\uBA74 Spring Boot\uC758 \uAE30\uBCF8 \uC815\uC801 \uB9AC\uC18C\uC2A4 \uB9E4\uD551(\uC608: /static, /public)\uC744 \uBE44\uD65C\uC131\uD654
# - \uC815\uC801 \uB9AC\uC18C\uC2A4\uB97C \uC9C1\uC811 \uC81C\uC5B4\uD558\uAC70\uB098 \uCEE4\uC2A4\uD140\uD560 \uB54C \uC720\uC6A9
spring.web.resources.add-mappings=false

# server.error.include-* : \uC5D0\uB7EC \uC751\uB2F5\uC5D0 \uC5B4\uB5A4 \uC815\uBCF4\uB97C \uD3EC\uD568\uD560\uC9C0 \uACB0\uC815
# - include-message: \uC5D0\uB7EC \uBA54\uC2DC\uC9C0\uB97C \uD3EC\uD568 (\uC8FC\uC758: \uBBFC\uAC10\uD55C \uC608\uC678 \uBA54\uC2DC\uC9C0\uAC00 \uB178\uCD9C\uB420 \uC218 \uC788\uC74C)
# - include-binding-errors: \uBC14\uC778\uB529(\uAC80\uC99D) \uC624\uB958 \uC0C1\uC138\uB97C \uD3EC\uD568
# - include-exception: (true\uBA74 \uC608\uC678 \uD074\uB798\uC2A4/\uC2A4\uD0DD\uC744 \uD3EC\uD568) \uBCF4\uD1B5 \uC6B4\uC601\uC5D0\uC11C\uB294 false\uB85C \uB450\uB294 \uAC83\uC774 \uC548\uC804
# \uAC1C\uBC1C/\uB514\uBC84\uADF8 \uC2DC\uC5D0\uB294 \uC77C\uBD80\uB97C true\uB85C \uD574\uC11C \uC790\uC138\uD55C \uC815\uBCF4\uB97C \uD655\uC778\uD558\uC9C0\uB9CC, \uC6B4\uC601\uC5D0\uC11C\uB294 \uBBFC\uAC10\uC815\uBCF4 \uB178\uCD9C \uC8FC\uC758
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# -------------------------
# \uB85C\uAE45 \uC124\uC815 (Spring Boot \uC790\uCCB4 \uB808\uBCA8 \uC124\uC815)
# -------------------------
# \uB85C\uAE45 \uB808\uBCA8 \uC6B0\uC120\uC21C\uC704: TRACE < DEBUG < INFO < WARN < ERROR
# - root : \uC804\uCCB4 \uB85C\uADF8\uC758 \uAE30\uBCF8 \uB808\uBCA8 (\uC5EC\uAE30\uC11C\uB294 INFO)
logging.level.root=INFO

# \uD2B9\uC815 \uD328\uD0A4\uC9C0(\uC5EC\uAE30\uC11C\uB294 \uC608\uC2DC)\uC758 \uB85C\uADF8 \uB808\uBCA8\uC744 \uB354 \uC790\uC138\uD788 \uBCF4\uACE0 \uC2F6\uC744 \uB54C \uC0AC\uC6A9
# \uC8FC\uC758: \uD328\uD0A4\uC9C0\uBA85\uC774 \uC2E4\uC81C \uD504\uB85C\uC81D\uD2B8 \uD328\uD0A4\uC9C0\uC640 \uC77C\uCE58\uD574\uC57C \uD6A8\uACFC\uAC00 \uC788\uC2B5\uB2C8\uB2E4.
# \uC608: \uD504\uB85C\uC81D\uD2B8\uC758 \uC2E4\uC81C \uB8E8\uD2B8 \uD328\uD0A4\uC9C0\uAC00 com.study.exception \uC774\uBA74 \uC5EC\uAE30\uC5D0 \uB9DE\uCDB0 \uC218\uC815\uD558\uC138\uC694.
# logging.level.com.example.geh=DEBUG
logging.level.com.example.geh=DEBUG

# (\uCC38\uACE0) Hibernate SQL \uB85C\uADF8\uB97C \uBCF4\uACE0 \uC2F6\uB2E4\uBA74:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# -> \uC6B4\uC601\uC5D0\uC11C\uB294 \uB9CE\uC740 \uB85C\uADF8\uAC00 \uBC1C\uC0DD\uD558\uBBC0\uB85C \uC8FC\uC758

############################################################
# \uCD94\uAC00 \uC124\uBA85 / \uAD8C\uC7A5\uC0AC\uD56D (\uD55C\uB208\uC5D0 \uBCF4\uAE30)
#
# 1) \uBBFC\uAC10\uC815\uBCF4(\uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uBE44\uBC00\uBC88\uD638 \uB4F1)\uB294 \uC808\uB300 \uAE43\uD5C8\uBE0C\uC5D0 \uADF8\uB300\uB85C \uC62C\uB9AC\uC9C0 \uB9C8\uC138\uC694.
#    \uC6B4\uC601: \uD658\uACBD\uBCC0\uC218(\uD658\uACBD\uBCC4 \uD504\uB85C\uD30C\uC77C) \uB610\uB294 \uC2DC\uD06C\uB9BF \uB9E4\uB2C8\uC800 \uC0AC\uC6A9 \uAD8C\uC7A5.
#
# 2) spring.jpa.hibernate.ddl-auto=update \uB294 \uAC1C\uBC1C\uC5D0\uC11C\uB294 \uD3B8\uD558\uC9C0\uB9CC \uC6B4\uC601\uC5D0\uC11C\uB294 \uC704\uD5D8\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
#    \uC6B4\uC601 \uD658\uACBD\uC5D0\uC11C\uB294 validate \uB610\uB294 none\uC744 \uAD8C\uC7A5\uD569\uB2C8\uB2E4.
#
# 3) \uC5D0\uB7EC \uD398\uC774\uC9C0\uB97C \uD14C\uC2A4\uD2B8\uD558\uACE0 \uC2F6\uB2E4\uBA74:
#    - spring.mvc.throw-exception-if-no-handler-found=true \uB85C 404\uB97C \uC804\uC5ED \uC608\uC678 \uCC98\uB9AC\uC5D0\uC11C \uC7A1\uC744 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
#    - controller\uC5D0\uC11C \uC758\uB3C4\uC801\uC73C\uB85C \uC608\uC678\uB97C \uB358\uC838 \uD578\uB4E4\uB7EC \uB3D9\uC791\uC744 \uD655\uC778\uD558\uC138\uC694.
#
# 4) \uB85C\uAE45 \uD328\uD0A4\uC9C0 \uC124\uC815 \uC218\uC815:
#    - \uB85C\uADF8\uAC00 \uCC0D\uD788\uC9C0 \uC54A\uC73C\uBA74 \uD328\uD0A4\uC9C0\uBA85\uC774 \uC2E4\uC81C \uCF54\uB4DC\uC758 \uD328\uD0A4\uC9C0\uC640 \uB9DE\uB294\uC9C0 \uD655\uC778\uD558\uC138\uC694.
#      \uC608) \uD604\uC7AC \uCF54\uB4DC\uC5D0\uC11C \uB85C\uADF8\uB97C \uCC0D\uB294 \uD328\uD0A4\uC9C0\uAC00 com.study.exception \uC774\uBA74
#          logging.level.com.study.exception=DEBUG \uB85C \uC218\uC815\uD574\uC57C \uD569\uB2C8\uB2E4.
#
# 5) \uB85C\uCEEC \uD14C\uC2A4\uD2B8 \uC2DC DB \uC5F0\uACB0\uC774 \uC548 \uB420 \uACBD\uC6B0:
#    - MariaDB\uAC00 \uC2E4\uD589 \uC911\uC778\uC9C0, \uD3EC\uD2B8/\uACC4\uC815/\uBE44\uBC00\uBC88\uD638\uAC00 \uB9DE\uB294\uC9C0 \uD655\uC778\uD558\uC138\uC694.
#    - \uC5C6\uB294 DB\uC774\uBA74 \uC0DD\uC131\uD558\uAC70\uB098 \uC560\uD50C\uB9AC\uCF00\uC774\uC158\uC774 \uC0AC\uC6A9\uD560 \uACC4\uC815\uC744 \uB9CC\uB4E4\uC5B4 \uC8FC\uC138\uC694.
############################################################
